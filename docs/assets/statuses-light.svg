<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 170" width="1280" height="170" role="img" aria-label="Statuses: not backed up, at risk, note and safe"><title>Statuses: not backed up, at risk, note and safe</title><style>@font-face{font-family:'KCMono';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'KCSans';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}.lb{font:700 20px KCMono}.de{font:400 18.5px KCSans;fill:#33415C}</style><rect x="0" y="24" width="300" height="2" fill="#E5484D"/><text class="lb" x="0" y="70" fill="#E5484D">not backed up</text><text class="de" x="0" y="106">The code only exists on</text><text class="de" x="0" y="134">this computer.</text><rect x="320" y="24" width="300" height="2" fill="#E8850C"/><text class="lb" x="320" y="70" fill="#E8850C">at risk</text><text class="de" x="320" y="106">Uncommitted changes, unpushed</text><text class="de" x="320" y="134">commits or a tracked .env.</text><rect x="640" y="24" width="300" height="2" fill="#0891B2"/><text class="lb" x="640" y="70" fill="#0891B2">note</text><text class="de" x="640" y="106">Stashes, and work keepcode</text><text class="de" x="640" y="134">has already saved.</text><rect x="960" y="24" width="300" height="2" fill="#64748B"/><text class="lb" x="960" y="70" fill="#64748B">safe</text><text class="de" x="960" y="106">Everything is committed</text><text class="de" x="960" y="134">and pushed.</text></svg>