<style>
.ln{animation:in .5s ease-out backwards}
@keyframes in{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.cur{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ul{stroke-dasharray:300;animation:grow 1s ease-out 3.2s backwards}
@keyframes grow{from{stroke-dashoffset:300}to{stroke-dashoffset:0}}
.sig{stroke-dasharray:36 900;animation:run 5s linear infinite}
@keyframes run{from{stroke-dashoffset:936}to{stroke-dashoffset:0}}
.nm{animation:in .8s ease-out 2.7s backwards}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
